<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05060a">
  <title>JARVIS</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:      #05060a;
      --surface: rgba(255, 255, 255, 0.045);
      --surface2:rgba(255, 255, 255, 0.075);
      --line:    rgba(255, 255, 255, 0.085);
      --line-hi: rgba(255, 255, 255, 0.16);
      --text:    #eef0f6;
      --muted:   #8d95a9;
      --faint:   #596077;
      --accent:  #7c83ff;
      --accent2: #22d3ee;
      --green:   #34d399;
      --danger:  #ff6b81;
      --ease:    cubic-bezier(.22, .8, .24, 1);
      --col:     720px;
      --font:    -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html { background: var(--bg); }
    html, body { height: 100%; color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .bg span { position: absolute; border-radius: 50%; filter: blur(110px); }
    .bg .a { width: 520px; height: 520px; left: 50%; top: -280px; margin-left: -300px; background: radial-gradient(circle, #5b63ff, transparent 68%); opacity: .3; }
    .bg .b { width: 440px; height: 440px; right: -160px; bottom: -220px; background: radial-gradient(circle, #16b8d6, transparent 68%); opacity: .16; }

    /* ── header ── */
    header {
      flex: none; position: relative; z-index: 20; display: flex; align-items: center; gap: 12px;
      padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--line); background: rgba(5, 6, 10, .72);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .orb { flex: none; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d3d6ff, #6a72ff 55%, #2c31a6); box-shadow: 0 0 18px rgba(124,131,255,.55); }
    .brand b { font-size: 13.5px; font-weight: 650; letter-spacing: .3em; }

    .pill { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; color: var(--muted); transition: all .3s; }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .3s; }
    .pill.on { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.28); color: var(--green); }
    .pill.on .dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 2.2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }

    .enc-badge { display: none; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
    .enc-badge svg { width: 12px; height: 12px; }
    .enc-badge.on  { display: flex; color: var(--muted); background: var(--surface); border: 1px solid var(--line); }
    .enc-badge.off { display: flex; color: var(--danger); background: rgba(255,107,129,.08); border: 1px solid rgba(255,107,129,.25); }
    .spacer { flex: 1; }

    /* account menu */
    .me-wrap { position: relative; }
    .me { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; overflow: hidden; border-radius: 50%; border: 1px solid var(--line-hi); background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font: 650 14px var(--font); cursor: pointer; transition: box-shadow .2s, transform .12s; }
    .me:hover { box-shadow: 0 0 0 4px rgba(124,131,255,.18); }
    .me:active { transform: scale(.95); }
    .me img { width: 100%; height: 100%; object-fit: cover; }
    .menu { position: absolute; right: 0; top: calc(100% + 10px); width: 250px; padding: 8px; background: rgba(18, 20, 29, .96); border: 1px solid var(--line-hi); border-radius: 16px; box-shadow: 0 24px 60px -12px rgba(0,0,0,.8); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events: none; transition: opacity .16s, transform .2s var(--ease); }
    .menu.open { opacity: 1; transform: none; pointer-events: auto; }
    .who { padding: 10px 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .who strong { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu button { width: 100%; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; background: none; border: 0; border-radius: 10px; color: var(--text); font: 500 14px var(--font); cursor: pointer; text-align: left; }
    .menu button:hover { background: var(--surface2); }
    .menu button svg { width: 17px; height: 17px; color: var(--muted); }
    .menu .host { padding: 8px 10px 2px; font: 11.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--faint); }
    .menu .ver { padding: 0 10px 6px; font-size: 11.5px; color: var(--faint); }
    .menu .ver a { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 99px; background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.3); color: var(--green); font-weight: 600; text-decoration: none; }
    .menu .ver a:hover { background: rgba(52,211,153,.2); }

    /* ── feed ── */
    main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 22px max(16px, calc((100% - var(--col)) / 2)) 12px; scroll-behavior: smooth; overscroll-behavior: contain; }
    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

    .empty { margin: auto; padding: 24px 0 40px; text-align: center; animation: pop .5s var(--ease); }
    .empty .orb { width: 64px; height: 64px; margin: 0 auto 22px; box-shadow: 0 0 60px rgba(124,131,255,.5); animation: float 5s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px) scale(1.03); } }
    .empty h2 { font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
    .empty p  { margin: 8px auto 24px; max-width: 34ch; font-size: 14.5px; line-height: 1.55; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .chip { height: 36px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--text); font: 500 13.5px var(--font); cursor: pointer; transition: background .15s, border-color .15s, transform .12s; }
    .chip:hover { background: var(--surface2); border-color: var(--line-hi); }
    .chip:active { transform: scale(.97); }

    .msg { font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; animation: pop .22s var(--ease); }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
    .msg-u { align-self: flex-end; max-width: min(85%, 520px); padding: 10px 15px; background: var(--surface2); border: 1px solid var(--line); border-radius: 20px 20px 6px 20px; }
    .msg-j { align-self: flex-start; display: flex; gap: 12px; max-width: 100%; }
    .msg-j .orb { width: 24px; height: 24px; margin-top: 1px; box-shadow: 0 0 14px rgba(124,131,255,.4); }
    .msg-j .tx { min-width: 0; padding-top: 1px; }
    .msg-sys { align-self: center; padding: 2px 0; font-size: 12px; color: var(--faint); text-align: center; white-space: normal; }

    /* file cards */
    .msg-file { align-self: flex-end; width: min(100%, 340px); display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; animation: pop .22s var(--ease); }
    .fc-icon { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; background: rgba(124,131,255,.14); border: 1px solid rgba(124,131,255,.25); color: #b4b9ff; font: 700 10.5px var(--font); letter-spacing: .04em; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
    .fc-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { margin-top: 2px; font-size: 12px; color: var(--muted); }
    .fc-bar-wrap { height: 3px; margin-top: 8px; background: var(--line); border-radius: 3px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width .12s linear; }
    .fc-status { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: var(--danger); }
    .fc-dl { display: inline-block; margin-top: 7px; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; }
    .fc-dl:hover { text-decoration: underline; }

    .setup-card { align-self: stretch; padding: 16px 18px; font-size: 13px; line-height: 1.8; background: rgba(124,131,255,.07); border: 1px solid rgba(124,131,255,.22); border-radius: 16px; animation: pop .22s var(--ease); }

    /* ── quick actions (automation shortcuts) ── */
    .quick-wrap { flex: none; padding: 0 max(16px, calc((100% - var(--col)) / 2)) 8px; }
    .quick-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
    .quick-row::-webkit-scrollbar { display: none; }
    .qa-btn { flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--text); font: 600 13px var(--font); cursor: pointer; transition: background .15s, border-color .15s, transform .12s; }
    .qa-btn:hover { background: var(--surface2); border-color: var(--line-hi); }
    .qa-btn:active { transform: scale(.96); }
    .qa-btn.open { background: var(--surface2); border-color: rgba(124,131,255,.55); box-shadow: 0 0 0 3px rgba(124,131,255,.14); }
    .qa-badge { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font: 800 9.5px var(--mono, ui-monospace); letter-spacing: -.02em; color: #06070c; }
    .qa-badge.wa { background: #3ddc84; } .qa-badge.tg { background: #4fb3e8; } .qa-badge.ig { background: linear-gradient(135deg,#f6b34c,#e94a8c 55%,#8b5cf6); color: #fff; }
    .qa-badge.fb { background: #5b8def; color: #fff; } .qa-badge.dc { background: #8b93ff; } .qa-badge.sg { background: #4fa6f7; }
    .qa-badge.ot { background: var(--surface2); border: 1px solid var(--line-hi); color: var(--muted); }

    .qa-panel { flex: none; margin: 0 max(16px, calc((100% - var(--col)) / 2)) 10px; padding: 16px 16px 14px; border: 1px solid var(--line-hi); border-radius: 20px; background: rgba(20,22,32,.9); box-shadow: 0 20px 50px -20px rgba(0,0,0,.7); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); animation: qa-rise .22s cubic-bezier(.22,.8,.24,1); }
    @keyframes qa-rise { from { opacity: 0; transform: translateY(10px); } }
    .qa-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .qa-head .qa-badge { width: 30px; height: 30px; font-size: 10.5px; }
    .qa-head b { font-size: 14.5px; font-weight: 650; }
    .qa-head button { margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; background: none; border: 0; border-radius: 50%; color: var(--muted); cursor: pointer; }
    .qa-head button:hover { background: var(--surface2); color: var(--text); }
    .qa-field { margin-bottom: 10px; }
    .qa-field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .qa-field input, .qa-field textarea { width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font: 400 15px var(--font); outline: none; resize: none; transition: border-color .15s, box-shadow .15s; }
    .qa-field textarea { min-height: 66px; line-height: 1.45; }
    .qa-field input:focus, .qa-field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,131,255,.16); }
    .qa-field[hidden] { display: none; }
    .qa-actions { display: flex; gap: 8px; margin-top: 4px; }
    .qa-actions .send { position: static; flex: 1; width: auto; border-radius: 12px; height: 42px; gap: 8px; font: 650 14px var(--font); }
    .qa-actions .send svg { width: 17px; height: 17px; }
    .qa-cancel { flex: none; height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; background: none; color: var(--muted); font: 600 14px var(--font); cursor: pointer; }
    .qa-cancel:hover { background: var(--surface); color: var(--text); }

    .msg-quick { align-self: flex-end; width: min(100%, 340px); padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; animation: pop .22s var(--ease); }
    .msg-quick .qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .msg-quick .qhead b { font-size: 13px; }
    .msg-quick .qhead span { margin-left: auto; font-size: 11px; color: var(--faint); }
    .msg-quick p { font-size: 14px; line-height: 1.5; color: #d6d9ea; overflow-wrap: anywhere; }

    /* ── composer ── */
    footer { flex: none; padding: 8px max(16px, calc((100% - var(--col)) / 2)) max(14px, env(safe-area-inset-bottom)); }
    .composer { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 8px; background: rgba(20, 22, 32, .8); border: 1px solid var(--line-hi); border-radius: 28px; box-shadow: 0 16px 40px -18px rgba(0,0,0,.8); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); transition: border-color .18s, box-shadow .18s; }
    .composer:focus-within { border-color: rgba(124,131,255,.6); box-shadow: 0 0 0 4px rgba(124,131,255,.14), 0 16px 40px -18px rgba(0,0,0,.8); }
    #inp { flex: 1; min-width: 0; height: 42px; padding: 0 8px; background: none; border: 0; outline: none; color: var(--text); font: 400 16px var(--font); }
    #inp::placeholder { color: var(--faint); }
    .ic { flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; background: none; border: 0; border-radius: 50%; color: var(--muted); cursor: pointer; transition: background .15s, color .15s, transform .12s; }
    .ic:hover { background: var(--surface2); color: var(--text); }
    .ic:active { transform: scale(.94); }
    .ic svg { width: 20px; height: 20px; }
    #mic-btn.recording { background: rgba(255,107,129,.16); color: var(--danger); animation: mic-pulse 1.1s ease-in-out infinite; }
    #mic-btn.unsupported { opacity: .35; }
    @keyframes mic-pulse { 50% { box-shadow: 0 0 0 7px rgba(255,107,129,.12); } }
    .wake { display: none; flex: none; align-items: center; height: 34px; padding: 0 13px; margin-right: 2px; background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.32); border-radius: 99px; color: var(--green); font: 650 12.5px var(--font); cursor: pointer; }
    .wake.show { display: inline-flex; }
    .wake:hover { background: rgba(52,211,153,.18); }
    .send { flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; background: #f4f5fa; color: #0a0b10; border: 0; border-radius: 50%; cursor: pointer; transition: transform .12s, background .15s; }
    .send:hover { background: #fff; }
    .send:active { transform: scale(.93); }
    .send svg { width: 19px; height: 19px; }

    /* ── toast ── */
    #toast { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 54px); left: 50%; z-index: 40; transform: translate(-50%, -8px); padding: 8px 16px; background: rgba(18, 20, 29, .95); border: 1px solid var(--line-hi); border-radius: 99px; color: var(--text); font-size: 13px; font-weight: 550; white-space: nowrap; opacity: 0; pointer-events: none; box-shadow: 0 12px 30px -10px rgba(0,0,0,.7); transition: opacity .22s, transform .25s var(--ease); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    button:focus-visible, .ic:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 520px) { .brand b { letter-spacing: .22em; } .empty h2 { font-size: 23px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="a"></span><span class="b"></span></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <header>
    <div class="brand"><span class="orb" aria-hidden="true"></span><b>JARVIS</b></div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="spacer"></div>
    <div class="enc-badge" id="enc" title="Commands are encrypted between this device and your computer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span id="enc-t">AES-256</span>
    </div>
    <div class="me-wrap">
      <button class="me" id="me" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">•</button>
      <div class="menu" id="menu" role="menu">
        <div class="who"><strong id="who-name">This device</strong><span id="who-mail">Paired with a code</span></div>
        <button type="button" role="menuitem" id="signout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span id="signout-t">Sign out</span>
        </button>
        <div class="host">__IP__:__PORT__</div>
        <div class="ver" id="ver"></div>
      </div>
    </div>
  </header>

  <main id="feed">
    <div class="empty" id="empty">
      <div class="orb" aria-hidden="true"></div>
      <h2>How can I help?</h2>
      <p>Type or speak a command. JARVIS runs it on your computer.</p>
      <div class="chips">
        <button class="chip" type="button">What’s on my screen?</button>
        <button class="chip" type="button">Weather today</button>
        <button class="chip" type="button">System status</button>
        <button class="chip" type="button">Remind me in 10 minutes</button>
      </div>
    </div>
  </main>

  <div class="quick-wrap">
    <div class="quick-row" id="quick-row" role="tablist" aria-label="Send a message via">
      <button class="qa-btn" type="button" data-app="whatsapp" data-label="WhatsApp"><span class="qa-badge wa">WA</span>WhatsApp</button>
      <button class="qa-btn" type="button" data-app="telegram" data-label="Telegram"><span class="qa-badge tg">TG</span>Telegram</button>
      <button class="qa-btn" type="button" data-app="instagram" data-label="Instagram"><span class="qa-badge ig">IG</span>Instagram</button>
      <button class="qa-btn" type="button" data-app="messenger" data-label="Messenger"><span class="qa-badge fb">FB</span>Messenger</button>
      <button class="qa-btn" type="button" data-app="discord" data-label="Discord"><span class="qa-badge dc">DC</span>Discord</button>
      <button class="qa-btn" type="button" data-app="signal" data-label="Signal"><span class="qa-badge sg">SG</span>Signal</button>
      <button class="qa-btn" type="button" data-app="other" data-label="Other"><span class="qa-badge ot">···</span>Other</button>
    </div>
  </div>

  <form class="qa-panel" id="qa-panel" hidden>
    <div class="qa-head"><span class="qa-badge" id="qa-badge"></span><b id="qa-title"></b>
      <button type="button" id="qa-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="qa-field" id="qa-platform-field" hidden>
      <label for="qa-platform">App name</label>
      <input id="qa-platform" placeholder="e.g. Slack, Teams, Signal" autocomplete="off">
    </div>
    <div class="qa-field">
      <label for="qa-to">To</label>
      <input id="qa-to" placeholder="Contact name" autocomplete="off">
    </div>
    <div class="qa-field">
      <label for="qa-msg">Message</label>
      <textarea id="qa-msg" placeholder="What should JARVIS say?"></textarea>
    </div>
    <div class="qa-actions">
      <button type="button" class="qa-cancel" id="qa-cancel">Cancel</button>
      <button type="submit" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Send
      </button>
    </div>
  </form>

  <footer>
    <div class="composer">
      <label class="ic" for="file-inp" title="Send a file" aria-label="Send a file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg>
      </label>
      <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
      <input id="inp" placeholder="Ask JARVIS…" autocomplete="off" enterkeyhint="send" aria-label="Message JARVIS">
      <button class="ic" id="mic-btn" onclick="doMic()" title="Voice command" aria-label="Voice command"></button>
      <button class="wake" id="wake" onclick="doWake()">Wake</button>
      <button class="send" onclick="doSend()" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }
    function _lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
    function _lsDel(k) { try { localStorage.removeItem(k); }   catch (_) {} }

    // Token no longer known to the server (app restarted)? Go back to sign-in,
    // which reconnects silently if this device is remembered.
    function _expire() {
      sessionStorage.removeItem('jarvis_token'); sessionStorage.removeItem('jarvis_key');
      location.replace('/login');
    }
    if (_authToken) _authFetch('/api/files').then(r => { if (r.status === 401) _expire(); }).catch(() => {});

    // ── Account chip + menu ───────────────────────────────────────────────────
    (function initAccount() {
      let u = null;
      try { u = JSON.parse(sessionStorage.getItem('jarvis_user') || 'null'); } catch (_) {}
      const me = document.getElementById('me'), menu = document.getElementById('menu');
      if (u && u.name) {
        document.getElementById('who-name').textContent = u.name;
        document.getElementById('who-mail').textContent = u.email || '';
        if (u.picture) {
          const img = document.createElement('img');
          img.alt = ''; img.referrerPolicy = 'no-referrer'; img.src = u.picture;
          img.onerror = () => { img.remove(); me.textContent = u.name.trim().charAt(0).toUpperCase(); };
          me.textContent = ''; me.appendChild(img);
        } else {
          me.textContent = u.name.trim().charAt(0).toUpperCase();
        }
      } else {
        me.textContent = '\u25CF';
        document.getElementById('signout-t').textContent = 'Disconnect';
      }
      const setOpen = (v) => { menu.classList.toggle('open', v); me.setAttribute('aria-expanded', String(v)); };
      me.addEventListener('click', (e) => { e.stopPropagation(); setOpen(!menu.classList.contains('open')); });
      document.addEventListener('click', (e) => { if (!menu.contains(e.target)) setOpen(false); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
      document.getElementById('signout').addEventListener('click', async () => {
        try {
          await _authFetch('/api/auth/logout', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ device_token: _lsGet('jarvis_device_token') || '' }),
          });
        } catch (_) {}
        _lsDel('jarvis_device_token');
        ['jarvis_token', 'jarvis_key', 'jarvis_user'].forEach(k => sessionStorage.removeItem(k));
        location.replace('/login');
      });
    })();

    // ── Version + "update available" ──────────────────────────────────────────
    (async function versionCheck() {
      const el = document.getElementById('ver');
      try {
        const v = await (await fetch('/api/version')).json();
        el.textContent = 'JARVIS v' + v.version;
        if (!/^[\w.-]+\/[\w.-]+$/.test(v.repo || '') || v.repo.includes('YOUR-USERNAME')) return;
        let rel = null;
        try { rel = JSON.parse(sessionStorage.getItem('jarvis_latest') || 'null'); } catch (_) {}
        if (!rel) {
          const r = await fetch('https://api.github.com/repos/' + v.repo + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
          if (!r.ok) return;
          const j = await r.json();
          rel = { tag: j.tag_name || '', url: j.html_url || '' };
          sessionStorage.setItem('jarvis_latest', JSON.stringify(rel));
        }
        const num = (t) => String(t).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
        const a = num(rel.tag), b = num(v.version);
        let newer = false;
        for (let i = 0; i < 3; i++) { if ((a[i] || 0) !== (b[i] || 0)) { newer = (a[i] || 0) > (b[i] || 0); break; } }
        if (newer && /^https:\/\/github\.com\//.test(rel.url)) {
          const link = document.createElement('a');
          link.href = rel.url; link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'Update ' + rel.tag;
          el.appendChild(link);
        }
      } catch (_) {}
    })();

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; document.getElementById('enc-t').textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to JARVIS'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function _hideEmpty() {
      const e = document.getElementById('empty');
      if (e) e.remove();
    }
    function _scrollDown() { feed.scrollTop = feed.scrollHeight; }

    function append(speaker, text) {
      _hideEmpty();
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<span class="orb" aria-hidden="true"></span><div class="tx">${esc(text)}</div>`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = esc(text);
      }
      feed.appendChild(d);
      _scrollDown();
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); _scrollDown();
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Suggestion chips
    document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
      document.getElementById('inp').value = c.textContent.trim();
      doSend();
    }));

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const i = name.lastIndexOf('.');
      const ext = i > 0 ? name.slice(i + 1).toUpperCase().replace(/[^A-Z0-9]/g, '') : '';
      return esc((ext || 'FILE').slice(0, 4));
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      _hideEmpty();

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      _scrollDown();

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">Download back</a>`);
          toast('File sent');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = 'var(--danger)';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      _hideEmpty();
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      _scrollDown();
      toast('File received on computer');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Quick actions (automation shortcuts: WhatsApp, Telegram, etc.) ───────
    // These don't call a different API — they build the same plain-language
    // instruction you'd type yourself (e.g. "Send a WhatsApp message to Sam:
    // \"On my way\""), and send it through the same encrypted /api/command
    // channel as the message box below. JARVIS decides how to act on it,
    // exactly as it would for anything typed or spoken.
    var QA_APPS = {
      whatsapp:  { label: 'WhatsApp',  badge: 'wa', text: 'WA' },
      telegram:  { label: 'Telegram',  badge: 'tg', text: 'TG' },
      instagram: { label: 'Instagram', badge: 'ig', text: 'IG' },
      messenger: { label: 'Messenger', badge: 'fb', text: 'FB' },
      discord:   { label: 'Discord',   badge: 'dc', text: 'DC' },
      signal:    { label: 'Signal',    badge: 'sg', text: 'SG' },
      other:     { label: 'Other',     badge: 'ot', text: '\u00b7\u00b7\u00b7' },
    };
    var qaPanel = document.getElementById('qa-panel');
    var qaOpenApp = null;

    function qaOpen(app) {
      qaOpenApp = app;
      var meta = QA_APPS[app];
      document.querySelectorAll('.qa-btn').forEach(function (b) { b.classList.toggle('open', b.dataset.app === app); });
      var badge = document.getElementById('qa-badge');
      badge.className = 'qa-badge ' + meta.badge; badge.textContent = meta.text;
      document.getElementById('qa-title').textContent = 'Send via ' + (app === 'other' ? 'another app' : meta.label);
      document.getElementById('qa-platform-field').hidden = app !== 'other';
      qaPanel.hidden = false;
      var first = app === 'other' ? document.getElementById('qa-platform') : document.getElementById('qa-to');
      setTimeout(function () { first.focus({ preventScroll: true }); }, 20);
    }
    function qaClose() {
      qaPanel.hidden = true; qaOpenApp = null;
      document.querySelectorAll('.qa-btn').forEach(function (b) { b.classList.remove('open'); });
      document.getElementById('qa-to').value = ''; document.getElementById('qa-msg').value = ''; document.getElementById('qa-platform').value = '';
    }
    document.querySelectorAll('.qa-btn').forEach(function (b) {
      b.addEventListener('click', function () { qaOpenApp === b.dataset.app ? qaClose() : qaOpen(b.dataset.app); });
    });
    document.getElementById('qa-close').addEventListener('click', qaClose);
    document.getElementById('qa-cancel').addEventListener('click', qaClose);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !qaPanel.hidden) qaClose(); });

    qaPanel.addEventListener('submit', function (e) {
      e.preventDefault();
      var to  = document.getElementById('qa-to').value.trim();
      var msg = document.getElementById('qa-msg').value.trim();
      var appName = qaOpenApp === 'other' ? document.getElementById('qa-platform').value.trim() : QA_APPS[qaOpenApp].label;
      if (!to)  { document.getElementById('qa-to').focus(); return; }
      if (!msg) { document.getElementById('qa-msg').focus(); return; }
      if (qaOpenApp === 'other' && !appName) { document.getElementById('qa-platform').focus(); return; }

      var instruction = 'Send a ' + appName + ' message to ' + to + ': "' + msg + '"';
      var enc  = _encrypt(instruction);
      var body = enc ? { enc: enc } : { text: instruction };
      _authFetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

      _hideEmpty();
      var meta = qaOpenApp === 'other' ? { badge: 'ot', text: '\u00b7\u00b7\u00b7' } : QA_APPS[qaOpenApp];
      var card = document.createElement('div');
      card.className = 'msg-quick';
      card.innerHTML = '<div class="qhead"><span class="qa-badge ' + meta.badge + '">' + meta.text + '</span><b>' + esc(appName) + ' \u2192 ' + esc(to) + '</b><span>Sent</span></div><p>' + esc(msg) + '</p>';
      feed.appendChild(card);
      _scrollDown();
      qaClose();
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    const ICON_MIC  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
    const ICON_STOP = '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor"/></svg>';
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = ICON_MIC;
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }
    _micIdle();

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      _hideEmpty();
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.className = 'setup-card';
      card.innerHTML =
        '<div style="font-weight:650;color:#aab0ff;margin-bottom:10px">One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:var(--muted);margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:var(--text)">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:var(--green)">Enabled</strong> → tap <strong style="color:var(--text)">Relaunch</strong></li>' +
        '<li>Return here and tap the microphone</li>' +
        '</ol>';
      feed.appendChild(card);
      _scrollDown();
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = ICON_STOP;
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('Microphone live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
</html>
